<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ofertas Premium</title>

  <meta
    name="description"
    content="Ofertas Premium — Compra fácil, rápido y seguro."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #ffffff;
    }

    header {
      background: #111111;
      border-bottom: 1px solid #333;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #d4af37;
    }

    .cart {
      background: #d4af37;
      color: #000;
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 70px 20px 45px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(36px, 8vw, 70px);
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #d4af37;
    }

    .hero p {
      color: #bdbdbd;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .hero-button {
      display: inline-block;
      background: #d4af37;
      color: #000;
      padding: 13px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px 70px;
    }

    .section-title {
      font-size: 30px;
      margin-bottom: 25px;
    }

    .products {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      overflow: hidden;
    }

    .product-image {
      height: 220px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
    }

    .product-content {
      padding: 18px;
    }

    .product h3 {
      margin-bottom: 10px;
    }

    .product p {
      color: #999;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .price {
      color: #d4af37;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .product-button {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 7px;
      background: #d4af37;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      border-top: 1px solid #292929;
      padding: 30px 20px;
      text-align: center;
      color: #777;
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-direction: column;
      }

      .hero {
        padding-top: 45px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">

      <div class="logo">
        OFERTAS PREMIUM
      </div>

      <button
        class="cart"
        onclick="alert('El carrito se conectará en la siguiente etapa.')"
      >
        🛒 Carrito (0)
      </button>

    </div>
  </header>

  <main>

    <section class="hero">

      <h1>
        OFERTAS <span>PREMIUM</span>
      </h1>

      <p>
        Compra fácil, rápido y seguro.
      </p>

      <a
        class="hero-button"
        href="#productos"
      >
        Ver ofertas
      </a>

    </section>

    <section
      class="section"
      id="productos"
    >

      <h2 class="section-title">
        Ofertas destacadas
      </h2>

      <div class="products">

        <article class="product">

          <div class="product-image">
            Imagen del producto
          </div>

          <div class="product-content">

            <h3>
              Producto de ejemplo
            </h3>

            <p>
              Este producto será reemplazado
              por los productos reales de Supabase.
            </p>

            <div class="price">
              $0.00
            </div>

            <button
              class="product-button"
              onclick="alert('El sistema de pedidos se conectará próximamente.')"
            >
              Ver producto
            </button>

          </div>

        </article>

      </div>

    </section>

  </main>

  <footer>
    © 2026 Ofertas Premium —
    Compra fácil, rápido y seguro.
  </footer>

</body>
</html>
